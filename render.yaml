services:
  - type: web
    name: adaptiv
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: ANTHROPIC_API_KEY
        sync: false
